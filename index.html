<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Astronomski Utrinek — dnevne novice iz vesolja: odkritja, rakete, planeti in opazovanja nočnega neba." />
  <meta name="theme-color" content="#070708" />
  <title>Astronomski Utrinek — novice iz vesolja</title>
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/favicon-64.png" sizes="64x64" type="image/png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="home">
  <div id="starfield" class="starfield" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">
          <img class="brand-logo" src="assets/logo-clean.png" alt="Logotip Astronomski Utrinek"
               onerror="var p=this.parentElement; this.remove(); p.classList.add('is-fallback'); p.parentElement.classList.add('is-fallback');" />
          <span class="brand-emoji" aria-hidden="true">✦</span>
        </span>
        <span class="brand-text">Astronomski <strong>Utrinek</strong></span>
      </a>
      <nav class="main-nav" aria-label="Glavna navigacija">
        <a href="index.html" aria-current="page">Domov</a>
        <a href="novice.html">Novice</a>
        <a href="o-strani.html">O strani</a>
      </nav>
    </div>
  </header>

  <section class="hero" id="top">
    <figure class="hero-card" id="featuredCard" tabindex="0" role="link" aria-label="Odpri izbrano novico">
      <img id="featuredImg" src="assets/hero.jpg" alt="Slika dneva" />
      <div class="hero-card-shade"></div>
      <figcaption class="hero-card-caption">
        <div class="hero-caption-inner">
          <span class="badge badge-live" id="featuredBadge">Izbor urednika</span>
          <h1 id="featuredTitle">Zemlja ponoči iz vesolja</h1>
          <p id="featuredMeta"></p>
        </div>
      </figcaption>
    </figure>
  </section>

  <div class="edition-bar">
    <div class="container edition-inner">
      <p>Uredništvo · dnevnik vesolja</p>
      <a href="novice.html">Celoten arhiv</a>
    </div>
  </div>

  <main id="novice" class="news-section">
    <div class="container">
      <div class="section-head reveal">
        <div>
          <p class="section-kicker">Arhiv</p>
          <h2>Najnovejše novice</h2>
          <p class="section-sub" id="feedInfo">Nalagam novice&nbsp;…</p>
        </div>
        <input type="search" id="searchInput" class="search-input" placeholder="Išči v arhivu" aria-label="Išči novice" />
      </div>

      <div class="chips reveal" id="chips" role="tablist" aria-label="Filtri novic">
        <button class="chip is-active" data-filter="Vse">Vse</button>
        <button class="chip" data-filter="Vesolje">Vesolje</button>
        <button class="chip" data-filter="Planeti">Planeti</button>
        <button class="chip" data-filter="Rakete">Rakete</button>
        <button class="chip" data-filter="Opazovanje">Opazovanje</button>
        <button class="chip" data-filter="Raziskave">Raziskave</button>
        <button class="chip" data-filter="Uredniške">Uredniške</button>
      </div>

      <div id="feed" class="news-grid"></div>
      <div id="feedStatus" class="feed-status hidden"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-mark brand-mark-icon">A</span>
        <p><strong>Astronomski Utrinek</strong><br />Novice iz vesolja, vsak dan.</p>
      </div>
      <nav class="footer-nav" aria-label="Navigacija v nogi">
        <a href="index.html">Domov</a>
        <a href="novice.html">Novice</a>
        <a href="o-strani.html">O strani</a>
      </nav>
    </div>
    <div class="container footer-bottom">
      <p id="secretTrigger" class="secret-trigger">© 2026 Astronomski Utrinek. Vse pravice pridržane.</p>
      <p class="footer-issue">Številka 08 · Avgust 2026</p>
    </div>
  </footer>

  <script src="firebase-config.js"></script>
  <script src="firebase.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
