<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Prijava — Astronomski Utrinek</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Prijava in profil — Astronomski Utrinek." />
  <link rel="canonical" href="https://astronomskiutrinek.top/prijava" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/assets/favicon-48.png" sizes="48x48" type="image/png" />
  <link rel="icon" href="/assets/favicon-96.png" sizes="96x96" type="image/png" />
  <link rel="icon" href="/assets/favicon-144.png" sizes="144x144" type="image/png" />
  <link rel="icon" href="/assets/favicon-192.png" sizes="192x192" type="image/png" />
  <link rel="icon" href="/assets/favicon-512.png" sizes="512x512" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="auth">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">
          <img class="brand-logo" src="assets/logo-clean.png" alt="Logotip Astronomski Utrinek" />
        </span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Odpri meni" aria-expanded="false" aria-controls="mainNav">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav" aria-label="Glavna navigacija">
        <a href="index.html">Domov</a>
        <a href="o-strani.html">O strani</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="container auth-grid">
      <section id="authGuest" class="auth-card">
        <p class="section-kicker">Račun</p>
        <h1>Prijava</h1>
        <p class="modal-sub">Ustvari profil za komentarje. Prijavi se lahko tudi z Google računom.</p>

        <div class="auth-tabs">
          <button type="button" class="chip is-active" data-auth-tab="login">Prijava</button>
          <button type="button" class="chip" data-auth-tab="register">Nov profil</button>
        </div>

        <form id="loginForm" class="auth-form">
          <label>E-pošta<input id="loginEmail" class="text-input" type="email" required /></label>
          <label>Geslo<input id="loginPass" class="text-input" type="password" required /></label>
          <button class="btn btn-primary" type="submit">Prijava</button>
        </form>

        <form id="registerForm" class="auth-form hidden">
          <label>Ime<input id="regName" class="text-input" type="text" required placeholder="Tvoje ime" /></label>
          <label>E-pošta<input id="regEmail" class="text-input" type="email" required /></label>
          <label>Geslo<input id="regPass" class="text-input" type="password" required minlength="4" /></label>
          <label class="btn btn-ghost">Slika profila
            <input id="regPhoto" type="file" accept="image/*" hidden />
          </label>
          <img id="regPreview" class="profile-avatar hidden" alt="" />
          <button class="btn btn-primary" type="submit">Ustvari profil</button>
        </form>

        <button type="button" class="btn btn-ghost btn-google" id="googleBtn">
          <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/>
          </svg>
          Nadaljuj z Google
        </button>
        <p id="authError" class="error hidden"></p>
      </section>

      <section id="authUser" class="auth-card hidden">
        <p class="section-kicker">Tvoj profil</p>
        <div class="about-profile">
          <img id="meAvatar" class="profile-avatar" alt="" />
          <div>
            <h1 id="meName">—</h1>
            <p id="meEmail"></p>
          </div>
        </div>
        <label class="btn btn-small">
          Zamenjaj sliko
          <input id="mePhoto" type="file" accept="image/*" hidden />
        </label>
        <div class="profile-name-edit">
          <input id="meNameInput" class="text-input" type="text" maxlength="40"
                 placeholder="Novo ime…" aria-label="Spremeni ime" />
          <button class="btn btn-primary btn-small" id="saveNameBtn" type="button">Spremeni ime</button>
        </div>
        <div class="modal-actions">
          <a class="btn btn-ghost" href="index.html">K novicam</a>
          <button class="btn btn-danger-ghost" id="logoutBtn" type="button">Odjava</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p class="secret-trigger">© 2026 Astronomski Utrinek. Vse pravice pridržane.</p>
      <a class="footer-support" href="mailto:filip.knez28@gmail.com">Podpora: filip.knez28@gmail.com</a>
    </div>
  </footer>

  <script src="firebase-config.js"></script>
  <script src="analytics.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script>
    (function () {
      const c = window.FIREBASE_CONFIG || {};
      if (c.apiKey && window.firebase) {
        try { firebase.initializeApp(c); } catch (e) { /* already */ }
      }
    })();
  </script>
  <script src="firebase.js"></script>
  <script src="editor.js"></script>
  <script src="auth.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
